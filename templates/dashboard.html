<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar bg-dark navbar-dark">
  <div class="container">
    <span class="navbar-brand">Welcome, {{ student[1] }}</span>
    <a href="/" class="btn btn-light btn-sm">Logout</a>
  </div>
</nav>

<div class="container mt-4">
<h3>Student Dashboard</h3>
<table class="table table-bordered mt-3">
<tr><th>ID</th><td>{{ student[0] }}</td></tr>
<tr><th>Name</th><td>{{ student[1] }}</td></tr>
<tr><th>Email</th><td>{{ student[2] }}</td></tr>
<tr><th>Phone</th><td>{{ student[4] }}</td></tr>
<tr><th>Course</th><td>{{ student[5] }}</td></tr>
</table>

<div id="feesStatus"></div>

<script>
let fees = 40000;
document.getElementById('feesStatus').innerHTML = "<div class='alert alert-info mt-3'>Your Course Fees: Rs. "+fees+"</div>";
</script>

</div>
</body>
</html>
